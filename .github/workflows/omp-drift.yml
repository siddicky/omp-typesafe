name: omp drift

# The type check compares src/host.ts with the pinned omp release (see test/host-compat.ts). This weekly run does the
# same against the latest release, so an omp change that breaks the extension shows up before anyone bumps the pin.
# `--exact` keeps package.json's pin an exact version, as test/docs.test.ts requires; without it bun writes a caret range
# and the test step would fail every week whether or not omp had drifted.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-omp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun add --dev --exact @oh-my-pi/pi-coding-agent@latest
      - run: bun run typecheck
      - run: bun test
